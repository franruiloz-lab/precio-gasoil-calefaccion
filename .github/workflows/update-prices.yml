name: Update Prices Daily

on:
  schedule:
    # 09:00h España (08:00 UTC)
    - cron: '0 8 * * *'
    # 13:00h España (12:00 UTC)
    - cron: '0 12 * * *'
    # 18:00h España (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update prices from MITECO API
        run: node scripts/update-prices.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/precios.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/precios.json src/data/historico.json
          git commit -m "Actualizar precios $(date +%Y-%m-%d)"
          git push
